name: PR Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-template:
    name: Validate PR Template
    runs-on: ubuntu-latest
    steps:
      - name: Validate mandatory sections and checkboxes
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body || "";

            const requiredSections = [
              "## Assessment Scope Coverage (MANDATORY)",
              "## Architecture Checklist (MANDATORY)",
              "## Testing Evidence (MANDATORY)",
              "## README Discussion Prompt",
              "## Risk and Rollback"
            ];

            const requiredCheckedItems = [
              "Service exploration behavior is preserved or improved",
              "Category filtering keeps clear active state",
              "Loading state is handled",
              "Error state includes retry action",
              "Empty state is handled",
              "Featured services section remains above main list",
              "Service detail availability behavior is correct",
              "Unavailable CTA is disabled and explained",
              "Form validation behavior is correct",
              "Submit remains disabled until valid",
              "Simulated request delay and success/error handling are correct",
              "`ServiceCard` is reusable across multiple contexts",
              "No duplicated card implementations",
              "No `any`",
              "No dead code",
              "No massive components",
              "No unnecessary dependencies",
              "No unjustified abstractions",
              "Code follows target structure in `AGENTS.md`",
              "Quality checks executed (`npm run lint && npm run typecheck`)",
              "Manual validation performed for affected UX states"
            ];

            const missingSections = requiredSections.filter((section) => !body.includes(section));

            const uncheckedItems = requiredCheckedItems.filter((item) => {
              const escapedItem = item.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const checked = new RegExp(`- \\[x\\]\\s+${escapedItem}`, "i");
              return !checked.test(body);
            });

            const hasEvidenceHeader = body.includes("Evidence:");
            const hasLintEvidence = /-\s*Lint:\s*\S+/i.test(body);
            const hasTypecheckEvidence = /-\s*Typecheck:\s*\S+/i.test(body);
            const hasRiskLevel = /Risk level:\s*(Low|Medium|High)/i.test(body);
            const hasRollbackPlan = /Rollback plan:\s*\S+/i.test(body);

            const errors = [];

            if (missingSections.length) {
              errors.push(`Missing required sections: ${missingSections.join(", ")}`);
            }

            if (uncheckedItems.length) {
              errors.push(`Unchecked mandatory checklist items:\n- ${uncheckedItems.join("\n- ")}`);
            }

            if (!hasEvidenceHeader || !hasLintEvidence || !hasTypecheckEvidence) {
              errors.push("Testing evidence is incomplete. Fill Lint and Typecheck evidence lines with concrete results.");
            }

            if (!hasRiskLevel || !hasRollbackPlan) {
              errors.push("Risk and rollback section is incomplete. Provide risk level and rollback plan.");
            }

            if (errors.length) {
              core.setFailed(errors.join("\n\n"));
            }
